<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Raghav Realty · Sales Dashboard</title>
<link rel="icon" type="image/png" href="assets/mark.png">
<link rel="apple-touch-icon" href="assets/mark.png">
<link rel="preload" as="image" href="assets/logo-dark.png">
<style>
:root{
  color-scheme:light;
  --bg:#F1F2FA;--card:#FFFFFF;--ink:#1B1C33;--ink2:#44475F;--muted:#5D607A;--line:#E6E7F2;--hover:#F3F2FE;--sel:#E8E5FD;
  --shadow:0 1px 2px rgba(30,27,75,.06),0 6px 18px rgba(30,27,75,.08);--shadow2:0 2px 4px rgba(30,27,75,.08),0 12px 26px rgba(30,27,75,.15);
  --raise:0 1px 3px rgba(30,27,75,.18),inset 0 -1px 0 rgba(30,27,75,.08);--inset:inset 0 2px 4px rgba(30,27,75,.18);--well:#ECEBFB;
  --target:#C3C6DA;--target2:#8E92B0;--good:#15803D;--warn:#B45309;--bad:#B91C1C;
  --goodbg:#DCFCE7;--warnbg:#FEF3C7;--badbg:#FEE2E2;
  --bar1:#6D5EF0;--bar2:#3F2FC4;--alt1:#2BB3A3;--alt2:#0F766E;--hold:#F59E0B;--unsold:#E2E4F0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F1020;--card:#1A1B2E;--ink:#ECECF6;--ink2:#CBCDE0;--muted:#A4A6C0;--line:#2E3049;--hover:#24253C;--sel:#2F2C5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 2px 4px rgba(0,0,0,.5),0 12px 26px rgba(0,0,0,.5);
  --raise:0 1px 3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);--inset:inset 0 2px 4px rgba(0,0,0,.55);--well:#14152A;
  --target:#4A4D6C;--target2:#9A9DC0;--good:#4ADE80;--warn:#FBBF24;--bad:#FCA5A5;
  --goodbg:#123524;--warnbg:#3B2A08;--badbg:#431616;
  --bar1:#9B8FF8;--bar2:#6D5EF0;--alt1:#5EEAD4;--alt2:#14A89A;--hold:#FBBF24;--unsold:#34364F;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1020;--card:#1A1B2E;--ink:#ECECF6;--ink2:#CBCDE0;--muted:#A4A6C0;--line:#2E3049;--hover:#24253C;--sel:#2F2C5C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 2px 4px rgba(0,0,0,.5),0 12px 26px rgba(0,0,0,.5);
  --raise:0 1px 3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);--inset:inset 0 2px 4px rgba(0,0,0,.55);--well:#14152A;
  --target:#4A4D6C;--target2:#9A9DC0;--good:#4ADE80;--warn:#FBBF24;--bad:#FCA5A5;
  --goodbg:#123524;--warnbg:#3B2A08;--badbg:#431616;
  --bar1:#9B8FF8;--bar2:#6D5EF0;--alt1:#5EEAD4;--alt2:#14A89A;--hold:#FBBF24;--unsold:#34364F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 "Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bar1);outline-offset:1px}
.app{min-height:100vh;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
@media (min-width:1280px){.app{height:100vh;min-height:820px}.vis,.focus{flex:1;min-height:0}}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:8px 14px;color:#fff;background:linear-gradient(100deg,#2E2A85 0%,#4F2FBF 55%,#7A2FD6 100%)}
.hdr h1{margin:0;font-size:17px;font-weight:650;white-space:nowrap}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:#EDE9FE;padding:4px 12px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:#fff;color:#2E2A85}
.sp{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:#EDE9FE;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.live.stale i{background:#FBBF24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.tbtn{cursor:pointer;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.28)}

/* filters */
.flt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 14px;padding:6px 12px;background:var(--card);border-radius:12px;box-shadow:var(--shadow)}
.flt label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;max-width:190px}
select:hover{border-color:var(--bar1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sel);color:var(--ink);border:0;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.reset{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.reset:hover{background:var(--hover)}
.fbtn{display:none}
.sheet-h{display:none}

/* tiles */
.tiles,.tiles.six{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:8px;margin:0 14px}
.tile{position:relative;min-width:0;min-height:104px;border-radius:16px;padding:10px 12px;color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.22),var(--shadow);transition:transform .18s,box-shadow .18s;overflow:hidden;cursor:pointer;border:0;text-align:left;font:inherit}
.tile::after{content:"";position:absolute;inset:0 0 55% 0;border-radius:16px 16px 50% 50%/16px 16px 22px 22px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
.tile:hover{transform:translateY(-2px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.22),var(--shadow2)}
.tile:active{transform:translateY(1px);box-shadow:inset 0 3px 8px rgba(0,0,0,.3)}
.tile.sel{outline:3px solid var(--ink);outline-offset:3px}
.tile .tl{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.tile .tv{font-size:25px;font-weight:700;line-height:1.15;margin-top:5px;white-space:nowrap;letter-spacing:-.3px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tile .tv small{font-size:13px;font-weight:600;letter-spacing:0;margin-left:3px}
.tile .ts{font-size:11.5px;font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.t0{background:linear-gradient(135deg,#4F46E5,#3730A3)}.t1{background:linear-gradient(135deg,#C94532,#A92D22)}
.t2{background:linear-gradient(135deg,#0E7F75,#0B5F58)}.t3{background:linear-gradient(135deg,#FBBF3C,#F39C12);color:#2B1700}
.t4{background:linear-gradient(135deg,#2268DC,#1749A8)}.t5{background:linear-gradient(135deg,#7C3AED,#5B21B6)}
.t6{background:linear-gradient(135deg,#C71E68,#96114B)}.t7{background:linear-gradient(135deg,#27356F,#141C45)}
.t3 .tv{text-shadow:0 1px 0 rgba(255,255,255,.4)}
.tile.hasg{display:grid;grid-template-columns:minmax(0,1fr) 74px;grid-template-rows:auto auto 1fr;column-gap:6px}
.tile.hasg .tl{grid-column:1/3}
.tile.hasg .tv{grid-column:1;grid-row:2}
.tile.hasg .ts{grid-column:1/3;grid-row:3;align-self:end}
.gauge{grid-column:2;grid-row:2;width:74px;height:42px;margin-top:2px;overflow:visible}
.gauge .gt{stroke:rgba(0,0,0,.25)}.gauge .gf{stroke:#fff}.gauge .gh{fill:#fff;stroke:rgba(0,0,0,.3)}.gauge .gn{stroke:#fff}.gauge .gp{stroke:rgba(0,0,0,.55)}
.gauge .gx{fill:#fff;font-size:11px;font-weight:800}.t3 .gauge .gx{fill:#2B1700}
.t3 .gauge .gt{stroke:rgba(0,0,0,.15)}.t3 .gauge .gf,.t3 .gauge .gn{stroke:#2B1700}.t3 .gauge .gh{fill:#2B1700}
.si{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:12px;font-weight:800;line-height:1;flex:none}
.tile .si{position:absolute;top:8px;right:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 -1px 1px rgba(0,0,0,.15);z-index:1}
.si.good{color:#15803D}.si.warn{color:#B45309}.si.bad{color:#B91C1C}
.mini{height:5px;border-radius:9px;background:rgba(255,255,255,.28);margin-top:6px;overflow:hidden;position:relative}
.mini i{display:block;height:100%;border-radius:9px;background:#fff}
.mini b{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.55)}

/* cards */
.vis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;margin:0 14px}
.card{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:9px 12px;overflow:hidden}
.chd{display:flex;align-items:center;gap:8px;min-height:24px;margin-bottom:6px;flex-wrap:wrap}
.chd h2{margin:0;font-size:13.5px;font-weight:650;white-space:nowrap}
.chd .sub{font-size:11.5px;color:var(--muted);font-weight:600}
.togs{display:flex;gap:4px;margin-left:auto}
.tog{cursor:pointer;background:none;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tog:hover{background:var(--hover)}
.tog[aria-pressed="true"]{background:var(--sel);border-color:transparent;color:var(--ink)}
.cbd{flex:1;min-height:0;overflow:auto;position:relative}
.cbd.chart{overflow:hidden;min-height:180px}
.empty{height:100%;min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;text-align:center;padding:10px}
.note{font-size:11.5px;color:var(--muted);margin-top:4px}

/* tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--card);font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{font-size:12.5px;text-align:right;padding:0 4px;height:28px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:2px}
td:first-child{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis}
tfoot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--target2);position:sticky;bottom:0;background:var(--card)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
tr.on td{background:var(--sel)}
td.bar{width:34%;min-width:70px}
.hb{position:relative;height:12px;background:var(--line);border-radius:4px;overflow:visible}
.hb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--bar1),var(--bar2))}
.hb i.good{background:var(--good)}.hb i.warn{background:var(--warn)}.hb i.bad{background:var(--bad)}
.hb i.alt{background:linear-gradient(90deg,var(--alt1),var(--alt2))}
.hb b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pill{display:inline-block;min-width:42px;text-align:center;padding:1px 6px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill.good{background:var(--goodbg);color:var(--good)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.na{color:var(--muted)}
.dim{color:var(--muted)}

/* stacked bars */
.stk{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.stk i{display:block;height:100%}
.c-sold{background:var(--bar2)}.c-hold{background:var(--hold)}.c-uns{background:var(--alt1)}
.c-dir{background:var(--alt2)}.c-ind{background:var(--bar1)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.split{display:grid;grid-template-columns:80px 1fr 48px;gap:6px 8px;align-items:center;margin:6px 0}
.split .k{font-weight:600;font-size:12px}
.split .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

/* charts */
svg.ch{display:block;width:100%;height:100%}
.ch .b:hover{opacity:.85}
.ch .tg{stroke:var(--ink);stroke-width:2}
.ch .vl{font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle}
.ch .xl{font-size:10.5px;font-weight:600;fill:var(--muted);text-anchor:middle}
.ch .gl{stroke:var(--line)}
.ch .hit{fill:transparent;cursor:pointer}

/* focus */
.focus{display:grid;grid-template-columns:300px minmax(0,1.2fr) minmax(0,1fr);gap:8px;margin:0 14px}
.fa{justify-content:space-between;border-top:4px solid var(--fc,var(--bar2));padding:16px}
.fa-label{font-size:14px;font-weight:650;color:var(--ink2)}
.fa-num{font-size:54px;font-weight:800;line-height:1.05;letter-spacing:-1.5px;margin:10px 0 6px;word-break:break-word}
.fa-num small{font-size:18px;font-weight:650;letter-spacing:0;margin-left:5px;color:var(--ink2)}
.fa-state{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700}
.fa-state .si.good{background:var(--goodbg);color:var(--good)}.fa-state .si.warn{background:var(--warnbg);color:var(--warn)}.fa-state .si.bad{background:var(--badbg);color:var(--bad)}
.fa-line{font-size:14px;color:var(--ink2);margin-top:8px;line-height:1.4}
.fa-def{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.45;border-top:1px solid var(--line);padding-top:10px}
.fa-x{margin-top:12px;align-self:flex-start}

/* footer, states */
.srcnote{margin:0 14px;font-size:11.5px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;padding:16px}
.box{background:var(--card);border-radius:14px;box-shadow:var(--shadow2);padding:22px;max-width:380px;width:100%}
.box h2{margin:0 0 8px;font-size:17px}
.box p{margin:0 0 14px;color:var(--ink2);line-height:1.45}
.box input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:10px}
.box button{width:100%;padding:9px;border:0;border-radius:8px;background:var(--bar2);color:#fff;font-weight:700;cursor:pointer}
.err{color:var(--bad);font-weight:600;min-height:18px;font-size:12.5px}

/* branded loading screen */
.ld{flex-direction:column;gap:20px;overflow:hidden;background:radial-gradient(120% 90% at 20% 0%,#4A2326 0%,#2A1E21 45%,#141012 100%);color:#fff;transition:opacity .55s ease,transform .55s ease,filter .55s ease}
.ld.out{opacity:0;transform:scale(1.06);filter:blur(6px);pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(50px);opacity:.5;animation:drift 9s ease-in-out infinite alternate}
.o1{width:320px;height:320px;background:#E8432E;top:-80px;left:-60px;opacity:.4}
.o2{width:260px;height:260px;background:#9E1B22;bottom:-60px;right:-40px;animation-delay:-3s}
.o3{width:180px;height:180px;background:#F08A6E;top:55%;left:60%;opacity:.22;animation-delay:-6s}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.15)}}
.ldcard{position:relative;width:100%;max-width:340px;padding:32px 28px 24px;border-radius:24px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 60px rgba(10,4,6,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
.lglow{position:relative;display:flex;justify-content:center;margin:4px 0 12px}
.lglow::before{content:"";position:absolute;left:12%;top:5%;width:30%;height:90%;border-radius:50%;background:#E8432E;filter:blur(26px);opacity:.45;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.8;transform:scale(1.15)}}
.lgwrap{position:relative;display:block;animation:logoin .9s cubic-bezier(.2,.9,.3,1.2) .15s both}
.ldlogo{display:block;height:64px;width:auto}
.lgwrap::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%) 0 0/300% 100% no-repeat;-webkit-mask:url(assets/logo-dark.png) center/contain no-repeat;mask:url(assets/logo-dark.png) center/contain no-repeat;animation:sweep 2.8s ease-in-out 1s infinite}
@keyframes logoin{from{opacity:0;transform:translateY(10px) scale(.9);filter:blur(4px)}}
@keyframes sweep{from{background-position:100% 0}60%,to{background-position:0 0}}
.wsub{font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:4px}
.prog{height:6px;border-radius:99px;background:rgba(0,0,0,.3);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);margin:24px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;width:8%;border-radius:99px;background:linear-gradient(90deg,#9E1B22,#E8432E,#F7A08A);box-shadow:0 0 10px rgba(232,67,46,.7);transition:width .6s ease}
.ldstep{margin:0;font-size:13px;color:rgba(255,255,255,.85);min-height:18px;transition:opacity .25s}
.ldstep.fade{opacity:0}
.ldstep.bad{color:#FFC2B8}
.ldfoot{position:relative;font-size:11.5px;color:rgba(255,255,255,.55);letter-spacing:.3px}
.app.enter .tile{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
.app.enter .card{animation:rise .6s ease both;animation-delay:.25s}
.app.enter .tile:nth-child(2){animation-delay:.05s}.app.enter .tile:nth-child(3){animation-delay:.1s}.app.enter .tile:nth-child(4){animation-delay:.15s}.app.enter .tile:nth-child(5){animation-delay:.2s}.app.enter .tile:nth-child(6){animation-delay:.25s}.app.enter .tile:nth-child(7){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.95)}}
@media (prefers-reduced-motion:reduce){.ld *,.ld,.app.enter .tile,.app.enter .card{animation:none!important;transition:none!important}}
.brand{display:flex;align-items:center;gap:8px;line-height:1.1}
.brand{gap:12px}
.brand .plate{display:flex;flex:none;background:#fff;border-radius:10px;padding:4px 10px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08),0 2px 8px rgba(20,10,60,.28)}
.brand img{display:block;height:30px;width:auto}
.brand small{display:block;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;opacity:.85;padding-left:12px;border-left:1px solid rgba(255,255,255,.35)}
.gatelogo{display:block;height:48px;width:auto;margin:0 0 16px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);padding:6px 9px;border-radius:7px;font-size:12px;font-weight:600;z-index:60;display:none;max-width:260px;line-height:1.35}

/* laptop / tablet */
@media (max-width:1279px){
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}
  .vis{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}
  .card{min-height:330px}
  .focus{grid-template-columns:repeat(2,minmax(0,1fr))}
  .focus .fa{grid-column:1 / -1;min-height:0}
}
/* phone */
@media (max-width:760px){
  .hdr{flex-wrap:wrap;padding:8px 16px;gap:8px}
  .hdr h1{font-size:15px}
  .hdr .sp{display:none}
  .tabs{order:3;width:100%}
  .tabs button{flex:1}
  .fbtn{display:inline-flex}
  .flt{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:16px 16px 0 0;z-index:40;flex-direction:column;align-items:stretch;padding:14px 16px 20px;transform:translateY(105%);transition:transform .22s;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .flt.open{transform:none}
  .flt label{justify-content:space-between}
  .flt select{max-width:62%;padding:7px}

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var DAY=864e5, REFRESH_MS=5*60*1000;
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function lab(v){return v===""||v==null?"Not entered":v}
function fmt(n){return n==null||isNaN(n)?"–":Math.round(n).toLocaleString("en-IN")}
function pct(n,d){return d?n/d*100:null}
function fp(v,dp){return v==null?"–":v.toFixed(dp==null?(Math.abs(v)<10?1:0):dp)+"%"}
function median(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y}),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function isCP(src){return /channel/i.test(src)}

/* ---------- dates ---------- */
function today(){return Math.floor((Date.now()+5.5*36e5)/DAY)} // India time
function ymd(d){var x=new Date(d*DAY);return[x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()]}
function mkDay(y,m,d){return Math.floor(Date.UTC(y,m,d)/DAY)}
function ymOf(d){var a=ymd(d);return a[0]*100+a[1]+1}
function ymLab(ym){return MN[ym%100-1]+" "+String(Math.floor(ym/100)).slice(2)}
function monStart(ym){return mkDay(Math.floor(ym/100),ym%100-1,1)}
function monEnd(ym){return mkDay(Math.floor(ym/100),ym%100,0)}
function ymAdd(ym,n){var y=Math.floor(ym/100),m=ym%100-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y*100+m+1}
function addMonths(d,n){var a=ymd(d),ym=ymAdd(a[0]*100+a[1]+1,n),last=ymd(monEnd(ym))[2];return mkDay(Math.floor(ym/100),ym%100-1,Math.min(a[2],last))}
function weekOf(d){var a=ymd(d),first=new Date(Date.UTC(a[0],a[1],1)).getUTCDay();return Math.ceil((a[2]+((first+6)%7))/7)}
function monthsIn(p){var out=[],ym=ymOf(p.from),e=ymOf(p.to);while(ym<=e){out.push(ym);ym=ymAdd(ym,1)}return out}
function fyStart(d){var a=ymd(d);return a[1]>=3?a[0]:a[0]-1}

/* ---------- state ---------- */
var DATA=null,ROWS=[],INV=[],CT=[],ST=[],MIN_DAY=0;
var F={per:"fy",proj:"",cm:"",sm:"",src:"",cp:""};
var tab="mgmt",focus=null,ui={trend:"book",chan:"split",why:"lost",fdim:"proj",strend:"book",ssrc:"src"};
var lastLoad=0,loadErr="";

/* ---------- period ---------- */
function period(key){
  var t=today(),a=ymd(t),cur=a[0]*100+a[1]+1,fy=fyStart(t),p;
  if(key==="mtd")p={from:monStart(cur),to:t,label:"This month",shift:1};
  else if(key==="lm"){var l=ymAdd(cur,-1);p={from:monStart(l),to:monEnd(l),label:"Last month ("+ymLab(l)+")",shift:1}}
  else if(key==="qtd"){var qs=ymAdd(cur,-((a[1]-3+12)%3));p={from:monStart(qs),to:t,label:"This quarter",shift:3}}
  else if(key==="fy")p={from:mkDay(fy,3,1),to:t,label:"FY "+fy+"-"+String(fy+1).slice(2)+" to date",shift:12};
  else if(key==="lfy")p={from:mkDay(fy-1,3,1),to:mkDay(fy,2,31),label:"FY "+(fy-1)+"-"+String(fy).slice(2),shift:12};
  else if(key==="l12")p={from:monStart(ymAdd(cur,-11)),to:t,label:"Last 12 months",shift:12};
  else if(key==="all")p={from:MIN_DAY,to:t,label:"All time",shift:0};
  else if(/^m\d{6}$/.test(key)){var ym=+key.slice(1);p={from:monStart(ym),to:Math.min(monEnd(ym),t),label:ymLab(ym),shift:1,month:ym}}
  else return period("fy");
  if(key==="mtd")p.month=cur;if(key==="lm")p.month=ymAdd(cur,-1);
  p.key=key;p.full={from:p.from,to:p.month?monEnd(p.month):(key==="fy"?mkDay(fy+1,2,31):key==="qtd"?monEnd(ymAdd(ymOf(p.from),2)):p.to)};
  return p;
}
function prevOf(p){if(!p.shift)return null;return{from:addMonths(p.from,-p.shift),to:addMonths(p.to,-p.shift),label:p.shift===1?"last month":p.shift===3?"last quarter":"last year"}}

/* ---------- data ---------- */
function ingest(d){
  DATA=d;var f=d.fields,D=d.dict,ix={};f.forEach(function(k,i){ix[k]=i});
  ROWS=d.W.map(function(r){var o={};f.forEach(function(k,i){o[k]=D[k]?D[k][r[i]]:r[i]});o.uniq=/^unique\s*revisit$/i.test(o.awv||"");return o});
  MIN_DAY=ROWS.reduce(function(m,r){return r.vday>0&&r.vday<m?r.vday:m},today());
  CT=d.CT.map(function(r){return{m:r[0],ym:+r[1].replace("-",""),t:r[2],w:r[3]}});
  ST=d.ST.map(function(r){return{m:r[0],ym:+r[1].replace("-",""),b:r[2],t:r[3],w:r[4]}});
  INV=d.INV.map(function(r){return{proj:r[0],unit:r[1],floor:r[2],grp:r[3],st:r[4],area:r[5],type:r[6]}});
}
function pass(r,FF){
  if(FF.proj&&r.proj!==FF.proj)return false;
  if(FF.cm&&r.cm!==FF.cm)return false;
  if(FF.sm&&r.sm!==FF.sm)return false;
  if(FF.cp&&r.cp!==FF.cp)return false;
  if(FF.src){if(FF.src==="Direct"){if(isCP(r.src))return false}else if(FF.src==="Indirect"){if(!isCP(r.src))return false}else if(r.src!==FF.src)return false}
  return true;
}
function blank(){return{fresh:0,rev:0,gross:0,cx:0,hot:0,tat:[],cps:{},cpWalk:0}}
function fin(s){s.net=s.gross-s.cx;s.conv=pct(s.gross,s.fresh);s.tatM=median(s.tat);s.ncp=Object.keys(s.cps).length;return s}
// one pass: totals, optional groups by keyFn
function stats(FF,p,keyFn){
  var tot=blank(),G={};
  for(var i=0;i<ROWS.length;i++){var r=ROWS[i];if(!pass(r,FF))continue;
    var inV=r.vday>=p.from&&r.vday<=p.to,inB=r.bk&&r.bday>=p.from&&r.bday<=p.to,inC=r.cx&&r.cday>=p.from&&r.cday<=p.to;
    if(!inV&&!inB&&!inC)continue;
    var tg=[tot];if(keyFn){var k=keyFn(r);if(!G[k])G[k]=blank();tg.push(G[k])}
    for(var j=0;j<tg.length;j++){var s=tg[j];
      if(inV){if(r.kind===0){s.fresh++;if(r.aff==="Hot"&&!r.bk)s.hot++}else if(r.uniq)s.rev++;if(r.cp&&isCP(r.src)){s.cps[r.cp]=1;s.cpWalk++}}
      if(inB){s.gross++;if(r.vday>0&&r.bday>=r.vday)s.tat.push(r.bday-r.vday)}
      if(inC)s.cx++}}
  fin(tot);for(var g in G)fin(G[g]);
  return{tot:tot,G:G};
}
// buckets: months of p, or weeks 1-6 when p is one month
function series(FF,p,weekly){
  var keys=weekly?[1,2,3,4,5,6]:monthsIn(p),B={};keys.forEach(function(k){B[k]=blank()});
  function key(d){return weekly?weekOf(d):ymOf(d)}
  for(var i=0;i<ROWS.length;i++){var r=ROWS[i];if(!pass(r,FF))continue;var s;
    if(r.vday>=p.from&&r.vday<=p.to&&(s=B[key(r.vday)])){if(r.kind===0){s.fresh++;if(r.aff==="Hot"&&!r.bk)s.hot++}else if(r.uniq)s.rev++;if(r.cp&&isCP(r.src)){s.cps[r.cp]=1;s.cpWalk++}}
    if(r.bk&&r.bday>=p.from&&r.bday<=p.to&&(s=B[key(r.bday)])){s.gross++;if(r.vday>0&&r.bday>=r.vday)s.tat.push(r.bday-r.vday)}
    if(r.cx&&r.cday>=p.from&&r.cday<=p.to&&(s=B[key(r.cday)]))s.cx++}
  keys.forEach(function(k){fin(B[k])});
  if(weekly)while(keys.length>4&&!B[keys[keys.length-1]].fresh&&!B[keys[keys.length-1]].gross&&!B[keys[keys.length-1]].cx&&keys[keys.length-1]>weekOf(p.full.to))keys.pop();
  return{keys:keys,B:B};
}
/* ---------- targets ---------- */
function targets(FF,p){
  var months=monthsIn(p),res={book:null,walk:null,bookM:{},walkM:{},bookW:null,walkW:null,why:""};
  if(FF.proj||FF.src||FF.cp){res.why="Targets are set per manager, not per project or source";return res}
  var bRows,wRows;
  if(FF.cm&&FF.sm){res.why="No target for a closing + sourcing manager pair";return res}
  if(FF.cm){bRows=CT.filter(function(t){return t.m===FF.cm}).map(function(t){return{ym:t.ym,v:t.t,w:t.w}});wRows=null}
  else if(FF.sm){bRows=ST.filter(function(t){return t.m===FF.sm}).map(function(t){return{ym:t.ym,v:t.b,w:null}});wRows=ST.filter(function(t){return t.m===FF.sm}).map(function(t){return{ym:t.ym,v:t.t,w:t.w}})}
  else{bRows=CT.map(function(t){return{ym:t.ym,v:t.t,w:t.w}});wRows=ST.map(function(t){return{ym:t.ym,v:t.t,w:t.w}})}
  function sum(rows,M){var tot=0,any=false,W=[0,0,0,0,0,0],anyW=false;rows.forEach(function(t){if(months.indexOf(t.ym)<0)return;M[t.ym]=(M[t.ym]||0)+t.v;tot+=t.v;any=true;if(t.w)t.w.forEach(function(x,i){W[i]+=x;if(x)anyW=true})});return{tot:any?tot:null,W:anyW?W:null}}
  var b=sum(bRows,res.bookM);res.book=b.tot;res.bookW=b.W;
  if(wRows){var w=sum(wRows,res.walkM);res.walk=w.tot;res.walkW=w.W}
  if(res.book==null&&res.walk==null)res.why="No target set for "+(months.length===1?ymLab(months[0]):"these months");
  return res;
}
// achievement over months that have a target, with pace for a running period
function achieve(ser,M,metric){
  var got=0,tgt=0,ms=[];for(var k in M){k=+k;if(ser.B[k]){got+=metric(ser.B[k]);tgt+=M[k];ms.push(k)}}
  if(!ms.length||!tgt)return null;
  ms.sort();var s=monStart(ms[0]),e=monEnd(ms[ms.length-1]),t=today();
  var pace=t>=e?1:t<s?0:(t-s+1)/(e-s+1);
  var pc=got/tgt*100;
  return{got:got,tgt:tgt,pc:pc,pace:pace*100,st:pc>=pace*100?"good":pc>=pace*80?"warn":"bad"};
}
/* ---------- inventory ---------- */
function inv(proj){
  var s={tot:0,Sold:0,"On hold":0,Unsold:0,area:0,uArea:0};
  INV.forEach(function(u){if(proj&&u.proj!==proj)return;s.tot++;s[u.grp]++;s.area+=u.area;if(u.grp==="Unsold")s.uArea+=u.area});
  return s;
}
function invBy(proj,key){var G={};INV.forEach(function(u){if(proj&&u.proj!==proj)return;var k=u[key];if(!G[k])G[k]={tot:0,Sold:0,"On hold":0,Unsold:0};G[k].tot++;G[k][u.grp]++});return G}

/* ---------- metric catalogue ---------- */
var METRICS=[
  {id:"net",label:"Net Bookings",v:function(s){return s.net},f:fmt,tgt:"book",up:1,def:"Bookings (row has a Booking Date or Booking Done = Y) minus cancellations (Booking Cancellation = Yes) in the period. Booking month from Booking Date; cancellation month from Cancellation Date. Target: Closing Targets (Sourcing Targets when a sourcing manager is picked)."},
  {id:"fresh",label:"Fresh Walk-ins",v:function(s){return s.fresh},f:fmt,tgt:"walk",up:1,def:"Rows where Customer Fresh/Revisit (column AW) = Fresh, by Date of Visit. Target: Sourcing Targets → Walk-ins."},
  {id:"conv",label:"Walk-in to Booking",v:function(s){return s.conv},f:function(v){return fp(v)},up:1,min:5,def:"Bookings in the period ÷ fresh walk-ins in the period. No target is set for this."},
  {id:"rev",label:"Unique Revisits",v:function(s){return s.rev},f:fmt,up:1,def:"Rows where Customer Fresh/Revisit (column AW) = Unique Revisit, by Date of Visit. Second, third and later revisits are not counted."},

/* phone: a tile opens a full-screen detail page with its own history entry, so Back / swipe-back return to the dashboard */
var APP=document.querySelector(".app"),detY=0,NOMO=matchMedia("(prefers-reduced-motion:reduce)");

  var t=e.target,x;
  if((x=t.closest("[data-tab]"))){setTab(x.getAttribute("data-tab"));return}

  if(x){var id=x.getAttribute("data-tile");if(tab==="site"){tab="mgmt"}focus=focus===id?null:id;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if((x=t.closest("[data-ui]"))){ui[x.getAttribute("data-ui")]=x.getAttribute("data-uv");render();return}
  if((x=t.closest("[data-x]"))){F[x.getAttribute("data-x")]="";render();return}
  if((x=t.closest("[data-per]"))){F.per=x.getAttribute("data-per");render();return}
  if((x=t.closest("tr[data-f]"))){var f=x.getAttribute("data-f"),v=x.getAttribute("data-v");if(tab==="site"&&f==="proj")return;F[f]=F[f]===v?"":v;render();return}
});

  if(e.key==="Escape"){if($("flt").classList.contains("open"))$("flt").classList.remove("open");else if(focus){if(APP.classList.contains("detail"))goBack();else{focus=null;render()}}}
});
